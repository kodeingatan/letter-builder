<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, sans-serif">
  <rect width="1280" height="800" fill="#f6f5f4"/>
  <text x="40" y="50" font-size="28" font-weight="700">Wireframe — Auth (login / register) — Desktop 1280</text>
  <!-- image/hero panel -->
  <rect x="40" y="80" width="600" height="680" rx="16" fill="#213183"/>
  <circle cx="200" cy="300" r="40" fill="#62aef0" opacity="0.8"/>
  <rect x="380" y="420" width="60" height="60" rx="16" fill="#d6b6f6" opacity="0.8"/>
  <circle cx="480" cy="200" r="24" fill="#ff64c8" opacity="0.7"/>
  <text x="340" y="560" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">AppName</text>
  <text x="340" y="595" font-size="16" fill="#fff" opacity="0.85" text-anchor="middle">Deskripsi aplikasi</text>
  <!-- form panel -->
  <text x="700" y="130" font-size="20" font-weight="600">Selamat Datang</text>
  <text x="700" y="155" font-size="14" fill="#615d59">Masuk ke akun Anda</text>
  <rect x="700" y="180" width="400" height="420" rx="16" fill="#fff" stroke="#e6e6e6"/>
  <rect x="730" y="220" width="340" height="44" rx="4" fill="#fff" stroke="#e6e6e6"/>
  <rect x="730" y="280" width="340" height="44" rx="4" fill="#fff" stroke="#e6e6e6"/>
  <rect x="730" y="360" width="340" height="48" rx="24" fill="#0075de"/>
  <text x="900" y="390" font-size="16" font-weight="500" fill="#fff" text-anchor="middle">Masuk (pill CTA)</text>
  <text x="900" y="440" font-size="14" fill="#0075de" text-anchor="middle">Belum punya akun? Daftar</text>
  <text x="40" y="790" font-size="13" fill="#615d59">Tablet 768: panel hero jadi band atas 200px. Mobile &lt;768: single column, CTA full-width min 44px.</text>
</svg>
