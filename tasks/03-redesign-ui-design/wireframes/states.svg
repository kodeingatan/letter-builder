<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, sans-serif">
  <rect width="1280" height="800" fill="#f6f5f4"/>
  <text x="40" y="50" font-size="28" font-weight="700">Wireframe — States (loading/empty/error/success/validation/403)</text>
  <rect x="40" y="80" width="380" height="200" rx="12" fill="#fff" stroke="#e6e6e6"/>
  <text x="60" y="115" font-size="14" font-weight="600">Loading — NSpin overlay</text>
  <rect x="60" y="130" width="340" height="120" rx="8" fill="#f6f5f4"/>
  <text x="230" y="195" font-size="14" fill="#615d59" text-anchor="middle">◌ Memuat…</text>
  <rect x="440" y="80" width="380" height="200" rx="12" fill="#fff" stroke="#e6e6e6"/>
  <text x="460" y="115" font-size="14" font-weight="600">Empty — Empty-State Card</text>
  <rect x="460" y="130" width="340" height="120" rx="16" fill="#f6f5f4" stroke="#e6e6e6"/>
  <text x="630" y="180" font-size="14" text-anchor="middle">Belum ada data</text>
  <rect x="560" y="195" width="140" height="36" rx="18" fill="#0075de"/>
  <text x="630" y="218" font-size="14" fill="#fff" text-anchor="middle">+ Buat</text>
  <rect x="840" y="80" width="400" height="200" rx="12" fill="#fff" stroke="#e6e6e6"/>
  <text x="860" y="115" font-size="14" font-weight="600">Error — NAlert + retry</text>
  <rect x="860" y="130" width="360" height="60" rx="8" fill="#fef2f2" stroke="#EF4444"/>
  <text x="875" y="155" font-size="14">Gagal memuat data [Coba lagi]</text>
  <rect x="40" y="300" width="380" height="180" rx="12" fill="#fff" stroke="#e6e6e6"/>
  <text x="60" y="335" font-size="14" font-weight="600">Validation — inline</text>
  <rect x="60" y="350" width="340" height="40" rx="4" fill="#fff" stroke="#EF4444"/>
  <text x="60" y="410" font-size="12" fill="#DC2626">Username wajib diisi</text>
  <rect x="440" y="300" width="380" height="180" rx="12" fill="#fff" stroke="#e6e6e6"/>
  <text x="460" y="335" font-size="14" font-weight="600">403 — floating single</text>
  <rect x="460" y="350" width="340" height="56" rx="8" fill="#fff" stroke="#EF4444"/>
  <text x="475" y="375" font-size="14" font-weight="600">Akses Ditolak (4s, 1 instance)</text>
  <rect x="840" y="300" width="400" height="180" rx="12" fill="#fff" stroke="#e6e6e6"/>
  <text x="860" y="335" font-size="14" font-weight="600">Success — Toast</text>
  <rect x="860" y="350" width="220" height="44" rx="16" fill="#fff" stroke="#e6e6e6"/>
  <text x="875" y="378" font-size="14">✓ Berhasil</text>
  <text x="40" y="790" font-size="13" fill="#615d59">Semua state punya story variant + NT/E2E di FASE 2.</text>
</svg>
